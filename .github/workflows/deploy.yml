name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_ANALYTICS_DOMAIN: ${{ vars.PUBLIC_ANALYTICS_DOMAIN }}
          PUBLIC_ANALYTICS_SRC: ${{ vars.PUBLIC_ANALYTICS_SRC }}
      - name: Password-protect preview (only if PREVIEW_PASSWORD is set)
        env:
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: |
          if [ -n "$PREVIEW_PASSWORD" ]; then
            npx staticrypt dist -r -p "$PREVIEW_PASSWORD" --short --remember 30 -d dist-protected \
              --template-title "PARADOX CAT preview" \
              --template-instructions "Private preview. Enter the password you received." \
              --template-color-primary "#548CFF" --template-color-secondary "#010d16" \
              --template-button "Open preview"
            rm -rf dist && mv dist-protected/dist dist && rm -rf dist-protected
            printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
            rm -f dist/sitemap-*.xml
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
